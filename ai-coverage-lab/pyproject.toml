[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coverage-lab"
version = "0.1.0"
description = "Measured code coverage with grounded AI test recommendations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["coverage>=7.10"]

[project.optional-dependencies]
dev = ["ruff>=0.9", "playwright>=1.50"]

[project.scripts]
coverage-lab = "coverage_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coverage_lab = ["static/*.html"]

[tool.coverage.run]
branch = true
source = ["coverage_lab"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
line-ending = "lf"
