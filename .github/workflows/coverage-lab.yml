name: Coverage Lab CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ai-coverage-lab

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m coverage run -m unittest discover -s tests -v
      - run: python -m coverage report
      - run: python -m coverage xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: ai-coverage-lab/coverage.xml
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/e2e.py ../ai-coverage-sample --browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-evidence
          path: ai-coverage-lab/artifacts/
